version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
#  docker-compose.yml — local development stack
#  Usage:
#    docker compose up --build        start everything
#    docker compose up api            start only the API
#    docker compose run --rm api pytest  run tests inside container
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── FastAPI application ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # use builder stage so dev deps are available
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir app
      --loop asyncio
    working_dir: /app
    volumes:
      - .:/app                 # mount source for hot reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENV: development
      DEBUG: "true"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - saas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MailHog — local SMTP + inbox UI ──────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"    # SMTP — set SMTP_HOST=mailhog SMTP_PORT=1025 in .env
      - "8025:8025"    # Web UI → http://localhost:8025
    networks:
      - saas-net
    restart: unless-stopped

  # ── Stripe CLI — forward webhooks to local API ────────────────────────────
  stripe-cli:
    image: stripe/stripe-cli:latest
    command: >
      listen
      --api-key ${STRIPE_SECRET_KEY}
      --forward-to api:8000/api/v1/payments/webhook
      --skip-verify
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - saas-net
    profiles:
      - stripe            # opt-in: docker compose --profile stripe up


  # ── Redis — token denylist + future caching ───────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - saas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

networks:
  saas-net:
    driver: bridge
